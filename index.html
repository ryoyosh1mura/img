<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動くロケットの光時計</title>
<style>
  /* 色の設定（ここを変えると全体の色が変わる） */
  :root {
    --text: #1f1f1f;
    --sub: #6b6b6b;
    --line: #d9d9d9;
    --card: #f2f1ed;
    --light: #EF9F27;   /* 光の色 */
  }
  body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: var(--text); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
  .card { background: var(--card); border-radius: 8px; padding: 12px 16px; }
  .card small { color: var(--sub); }
  .card b { display: block; font-size: 24px; font-weight: 500; }
  svg text { font-size: 13px; fill: var(--sub); }
  svg text.h { font-size: 15px; fill: var(--text); font-weight: 500; }
  button { padding: 6px 14px; border: 1px solid #aaa; border-radius: 8px; background: #fff; cursor: pointer; }
</style>
</head>
<body>

<!-- ===== 1. 操作パネル（スライダー） ===== -->
<div class="row">
  <label for="s">ロケットの速さ</label>
  <input type="range" id="s" min="0" max="90" step="5" value="70" style="flex:1">
  <span id="sOut" style="min-width:100px;text-align:right"></span>
</div>

<!-- ===== 2. 絵の部分（SVG） ===== -->
<svg width="100%" viewBox="0 0 680 360">
  <!-- 上：地球の光時計 -->
  <text class="h" x="40" y="26">地球にいる僕（止まっている）</text>
  <line x1="70" y1="45"  x2="130" y2="45"  stroke="#333" stroke-width="3"/>  <!-- 上の鏡 -->
  <line x1="70" y1="145" x2="130" y2="145" stroke="#333" stroke-width="3"/>  <!-- 下の鏡 -->
  <circle id="eDot" cx="100" cy="145" r="6" fill="var(--light)"/>           <!-- 光 -->
  <text x="160" y="90">光は上下にまっすぐ往復</text>
  <text x="160" y="110">鏡に当たるたびに「カチッ」</text>

  <line x1="20" y1="172" x2="660" y2="172" stroke="var(--line)"/>

  <!-- 下：ロケットの光時計 -->
  <text class="h" x="40" y="196">ロケットに乗った僕（右へ動いている）</text>
  <polyline id="trail" fill="none" stroke="var(--light)" stroke-width="1.5" opacity="0.6"/> <!-- 光の通った跡 -->
  <g id="rocket">
    <rect x="-45" y="205" width="90" height="120" rx="10" fill="none" stroke="#888"/>
    <polygon points="45,240 70,265 45,290" fill="none" stroke="#888"/>
    <line x1="-30" y1="215" x2="30" y2="215" stroke="#333" stroke-width="3"/>
    <line x1="-30" y1="315" x2="30" y2="315" stroke="#333" stroke-width="3"/>
  </g>
  <circle id="rDot" cx="0" cy="315" r="6" fill="var(--light)"/>
  <text x="40" y="348">地球から見ると、光はジグザグに斜めに進む（光の速さは上と同じ）</text>
</svg>

<!-- ===== 3. カウンター ===== -->
<div class="cards">
  <div class="card"><small>地球の時計</small><b id="eCnt">0 カチ</b></div>
  <div class="card"><small>ロケットの時計</small><b id="rCnt">0 カチ</b></div>
  <div class="card"><small>ロケットの時間の流れ</small><b id="ratio"></b></div>
</div>
<p><button id="reset">カウントをリセット</button></p>

<!-- ===== 4. 動きの計算（JavaScript） ===== -->
<script>
// 光の速さ（画面上で 1 秒に何ピクセル進むか）。地球もロケットもこの値は同じ！
const C = 160;
const TOP1 = 45, BOT1 = 145;   // 地球の時計の鏡の位置
const TOP2 = 215, BOT2 = 315;  // ロケットの時計の鏡の位置
const X0 = 90, X1 = 560;       // ロケットが走る範囲

const slider = document.getElementById('s');
let ey, ed, ec, rx, ry, rd, rc, pts;
let last = performance.now();

function reset() {
  ey = BOT1; ed = -1; ec = 0;               // 地球の光：位置・向き・カチ数
  rx = X0; ry = BOT2; rd = -1; rc = 0;      // ロケット：横位置・光の高さ・向き・カチ数
  pts = [[rx, ry]];                          // 光の跡
}

function updateLabels() {
  const b = slider.value / 100;              // 速さ（光速に対する割合）
  document.getElementById('sOut').textContent = '光速の ' + slider.value + '%';
  document.getElementById('ratio').textContent = Math.round(Math.sqrt(1 - b * b) * 100) + '% の速さ';
}

slider.oninput = () => { updateLabels(); reset(); };
document.getElementById('reset').onclick = reset;
updateLabels(); reset();

// 毎フレーム呼ばれる関数（アニメーションの心臓部）
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.04);  // 前のフレームからの経過秒
  last = now;
  const b = slider.value / 100;

  // ★ここが相対性理論のポイント★
  // 光の速さ C は変えられない。ロケットが横に vx で動くなら、
  // 縦に使える速さは残りの vy = √(C² − vx²) だけになる。
  const vx = C * b;
  const vy = C * Math.sqrt(1 - b * b);

  // 地球の光：まっすぐ上下に速さ C で動く
  ey += ed * C * dt;
  if (ey <= TOP1) { ey = TOP1 + (TOP1 - ey); ed = 1;  ec++; }
  else if (ey >= BOT1) { ey = BOT1 - (ey - BOT1); ed = -1; ec++; }

  // ロケットの光：横に vx、縦に vy で動く（合計の速さは C）
  rx += vx * dt;
  ry += rd * vy * dt;
  let hit = false;
  if (ry <= TOP2) { ry = TOP2 + (TOP2 - ry); rd = 1;  rc++; hit = true; }
  else if (ry >= BOT2) { ry = BOT2 - (ry - BOT2); rd = -1; rc++; hit = true; }
  if (rx > X1) { rx = X0; pts = [[rx, ry]]; }   // 右端まで行ったら左から再スタート
  if (hit) pts.push([rx, rd === 1 ? TOP2 : BOT2]);

  // 画面に反映
  document.getElementById('eDot').setAttribute('cy', ey);
  document.getElementById('rocket').setAttribute('transform', 'translate(' + rx + ',0)');
  const d = document.getElementById('rDot');
  d.setAttribute('cx', rx); d.setAttribute('cy', ry);
  document.getElementById('trail').setAttribute('points',
    pts.concat([[rx, ry]]).map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
  document.getElementById('eCnt').textContent = ec + ' カチ';
  document.getElementById('rCnt').textContent = rc + ' カチ';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
